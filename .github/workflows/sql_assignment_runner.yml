name: SQL Unit Tests

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:  # Manual trigger from GitHub UI
    inputs:
      branch:
        description: 'Assignment 2 branch to grade, usually assignment-two'
        required: true
        default: assignment-two
        type: string
      pr_number:
        description: 'Pull request number. Extract a number from the end of pull request url, i.e. https://github.com/khsergvl/sql/pull/17'
        required: true
        type: string
        default: '1'
permissions:
  contents: read
  pull-requests: write

jobs:
  run-assignment-queries:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.head_ref == 'assignment-two' || github.head_ref == 'assignment-2') &&
      github.repository_owner != 'UofT-DSI')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r ./.github/scripts/requirements.txt

      - name: Get changed files
        id: changes
        run: |
          git fetch
          git diff --name-only origin/main > changed_files.txt
      
          echo "Changed files:"
          cat changed_files.txt
          assignment_changed=""

          if grep -qE '(^|/)assignment2\.sql$' changed_files.txt; then
            assignment_changed=$(grep -E '(^|/)assignment2\.sql$' changed_files.txt | head -n1)
          fi
          
          if [ -n "$assignment_changed" ]; then
            echo "assignment_changed=$assignment_changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        id: pytest
        if: steps.changes.outputs.assignment_changed != ''
        run: |
          pytest tests/test_assignment.py --file_path="${{steps.changes.outputs.assignment_changed}}" --tb=short --disable-warnings \
                 --junitxml=pytest-report.xml || true

      - name: Post test results to PR
        if: steps.changes.outputs.assignment_changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            function jsonToMarkdownTable(data) {
              if (!Array.isArray(data) || data.length === 0) {
                return 'No data';
              }
              
              const headers = Object.keys(data[0]);
              
              // Header row
              const headerRow = `| ${headers.join(' | ')} |`;
              
              // Separator row
              const separatorRow = `| ${headers.map(() => '---').join(' | ')} |`;
              
              // Data rows
              const rows = data.map(row =>
                `| ${headers.map(h => formatValue(row[h])).join(' | ')} |`
              );
              
              return [headerRow, separatorRow, ...rows].join('\n');
            }
              
            function formatValue(value) {
              if (value === null || value === undefined) return '';
              if (typeof value === 'object') return `\`${JSON.stringify(value)}\``;
              return String(value);
            }
          
            const fs = require('fs')
            const file_read_result = fs.readFileSync('test-results.json', 'utf8')
            const results = JSON.parse(file_read_result)

            let body = `### 🧪 SQL Assignment Results\n\n`
            body += `<details> <summary>Click to expand/collapse assignment queries execution results</summary>\n\n`

            for (const result of results) {
              const isArrayResult = Array.isArray(result.result);

              if (result.error || result.status === 'error') {
                body += `❌ **Query ${result.number}: SQL error**\n\n${result.feedback}\n\n`
                body += `**Error:** ${result.error}\n\n`
              } else if (result.status === 'incorrect') {
                body += `❌ **Query ${result.number}: Incorrect**\n\n${result.feedback}\n\n`
              } else if (result.status === 'correct') {
                body += `✅ **Query ${result.number}: Correct**\n\n${result.feedback}\n\n`
              } else {
                body += `⚪ **Query ${result.number}: Executed, not graded**\n\n${result.feedback}\n\n`
              }

              body += `\`\`\`sql\n${result.query}\n\`\`\`\n\n`

              if (isArrayResult && result.result.length > 0) {
                body += `**Sample results (up to 3 rows):**\n\n`
                const table = jsonToMarkdownTable(result.result)
                body += `${table} \n\n`
              }

              body += `-------------------------------------------------------- \n`;
            }

            body += `</details>`
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }},
              body
            })
